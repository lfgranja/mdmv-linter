type-complexity-threshold = 200
too-many-lines-threshold = 100

# Domain terms that should not trigger spelling warnings in docs.
doc-valid-idents = [
    "LLM",
    "AI",
    "API",
    "CLI",
    "TUI",
    "AST",
    "MCP",
    "DSPy",
    "PTY",
    "JIT",
    "FFI",
    "JSON",
    "TOML",
    "UUID",
    "URL",
    "HTTP",
    "HTTPS",
    "TCP",
    "UDP",
    "WebSocket",
    "OAuth",
    "JWT",
    "SemVer",
    "MSRV",
    "CI",
    "FR",
    "NN",
]
