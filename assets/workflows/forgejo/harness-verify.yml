# mdmv-linter harness gate — Forgejo Actions template (same behavior as GitHub).
# Required status check: the aggregator job `harness-verify`.
# Contract: contracts/cli-and-ci.md §2.
name: harness-verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate-lints:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned gate toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
      - name: Canonical gate (fmt -> clippy -> test)
        run: .mdmv/verify.sh
      - name: Fixture conformance
        run: mdmv-linter check --fixture
      - name: Minimum policy version gate
        run: mdmv-linter check --policy

  msrv-compat:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_WARNINGS: warn
    steps:
      - uses: actions/checkout@v4
      - name: Install declared MSRV toolchain
        run: |
          rustup toolchain install 1.81 --profile minimal
          rustup default 1.81
      - name: Build with declared MSRV
        run: cargo build --all-targets
      - name: Test with declared MSRV
        run: cargo test

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned gate toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Unit and integration tests
        run: cargo test
      - name: Supply-chain gate (cargo-deny)
        run: |
          cargo install cargo-deny --locked || true
          cargo deny check --config-path .cargo/deny.toml

  harness-verify:
    if: always()
    runs-on: ubuntu-latest
    needs: [gate-lints, msrv-compat, tests]
    steps:
      - name: Aggregate gate results
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"(failure|cancelled)"'; then
            echo "harness-verify: at least one gate job did not succeed"
            exit 1
          fi
          echo "harness-verify: all gate jobs succeeded"
